<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filme</title>

<style>
:root{
  --bg:#000;
  --bg-soft:#111;
  --card:rgba(0,0,0,.55);
  --text:#fff;
  --muted:#c7c7c7;
  --accent:#22c55e;
  --accent2:#22C4FD;
  --radius:16px;
  --shadow:0 12px 35px rgba(0,0,0,.45);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
}

/* ===== APP ===== */
#app{
  min-height:100vh;
}

/* ===== HERO / BANNER ===== */
#hero{
  position:relative;
  min-height:78vh;
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  display:flex;
  align-items:flex-end;
}

#hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top, rgba(0,0,0,.96) 0%, rgba(0,0,0,.72) 35%, rgba(0,0,0,.30) 65%, rgba(0,0,0,.20) 100%);
}

#hero::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:180px;
  background:linear-gradient(to top, #000 0%, transparent 100%);
}

#content{
  width:min(1200px, 100%);
  margin:0 auto;
  position:relative;
  z-index:2;
  padding:24px;
  margin-top:-180px;
}

/* ===== BLOCO PRINCIPAL ===== */
#topo{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:24px;
  align-items:end;
}

#poster{
  width:100%;
  max-width:240px;
  border-radius:18px;
  box-shadow:var(--shadow);
  background:#111;
  display:block;
}

#info{
  background:var(--card);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
}

#titulo{
  margin:0;
  font-size:clamp(1.8rem, 4vw, 3rem);
  line-height:1.1;
}

#meta{
  margin-top:10px;
  color:var(--muted);
  font-size:clamp(.95rem, 2vw, 1.05rem);
  line-height:1.5;
}

#generosTexto,
#sinopse{
  margin-top:14px;
  line-height:1.7;
}

#generosTexto{
  color:#f0f0f0;
  font-weight:600;
}

#sinopse{
  color:#f5f5f5;
  font-size:1rem;
}

/* ===== AÇÕES ===== */
#acoes{
  margin-top:18px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.botao{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:12px 18px;
  border-radius:999px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  font-size:1rem;
  font-weight:700;
  transition:transform .15s ease, opacity .15s ease, background .15s ease;
}

.botao:hover{
  transform:scale(1.03);
}

.botao-player{
  background:var(--accent2);
  color:#012a38;
}

.botao-voltar{
  background:#262626;
  color:#fff;
}

/* ===== PLAYER ===== */
#playerWrap{
  margin-top:26px;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.06);
}

#player{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
}

/* ===== SEÇÃO ===== */
.secao{
  margin-top:28px;
}

.secao h2{
  margin:0 0 14px;
  font-size:1.35rem;
}

/* ===== ELENCO ===== */
.elenco{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
  gap:14px;
}

.ator{
  background:#111;
  border-radius:14px;
  overflow:hidden;
  text-align:center;
  padding-bottom:10px;
  border:1px solid rgba(255,255,255,.06);
}

.ator img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#1b1b1b;
}

.ator .nome{
  font-size:.9rem;
  padding:8px 8px 0;
  line-height:1.3;
}

/* ===== ESTADOS ===== */
#loading,
#erro{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:30px;
  text-align:center;
  font-size:1.1rem;
  color:#ddd;
}

/* ===== FOCO TV ===== */
a:focus,
button:focus,
video:focus,
.ator:focus{
  outline:3px solid var(--accent);
  outline-offset:3px;
}

.botao:focus{
  background:var(--accent);
  color:#000;
  outline:none;
}

/* ===== MOBILE ===== */
@media (max-width: 900px){
  #hero{
    min-height:60vh;
    background-position:center top;
  }

  #content{
    margin-top:-110px;
    padding:16px;
  }

  #topo{
    grid-template-columns:1fr;
    gap:18px;
  }

  #poster{
    max-width:180px;
    margin:0 auto;
  }

  #info{
    padding:18px;
    border-radius:18px;
  }

  #acoes{
    flex-direction:column;
  }

  .botao{
    width:100%;
  }

  .elenco{
    grid-template-columns:repeat(3, 1fr);
  }
}

/* ===== TELAS MUITO PEQUENAS ===== */
@media (max-width: 560px){
  #hero{
    min-height:52vh;
  }

  #content{
    margin-top:-70px;
    padding:12px;
  }

  #info{
    padding:16px;
  }

  #titulo{
    font-size:1.6rem;
  }

  #meta,
  #sinopse,
  #generosTexto{
    font-size:.95rem;
  }

  .elenco{
    grid-template-columns:repeat(2, 1fr);
  }
}

/* ===== TV GRANDE ===== */
@media (min-width: 1400px){
  #hero{
    min-height:88vh;
  }

  #content{
    width:min(1320px, 100%);
  }

  #topo{
    grid-template-columns:280px 1fr;
    gap:32px;
  }

  #poster{
    max-width:280px;
  }

  #info{
    padding:28px;
  }

  .botao{
    min-height:52px;
    font-size:1.05rem;
  }

  .secao h2{
    font-size:1.5rem;
  }
}
</style>
</head>

<body>

<div id="app">
  <div id="loading">Carregando...</div>
</div>

<script>
const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("id");
const API_KEY = "9a9a8c6e53bf1e6c407b689e729a43c9";

function textoSeguro(v){
  return (v || "").toString().trim();
}

function numeroSeguro(v){
  if(v === null || v === undefined) return 0;
  if(typeof v === "number") return v;
  const limpo = String(v).replace(",", ".").replace(/[^\d.]/g, "");
  const n = parseFloat(limpo);
  return isNaN(n) ? 0 : n;
}

function anoSeguro(data){
  return textoSeguro(data).slice(0,4) || "—";
}

function runtimeSeguro(v){
  const n = numeroSeguro(v);
  return n > 0 ? `${n} min` : "Duração não informada";
}

function notaSeguro(v){
  const n = numeroSeguro(v);
  return n > 0 ? n.toFixed(1) : "—";
}

function votosSeguro(v){
  const n = numeroSeguro(v);
  return n > 0 ? n.toLocaleString("pt-BR") : "0";
}

function criarImagemElenco(profilePath, nome){
  if(profilePath){
    return `https://image.tmdb.org/t/p/w185${profilePath}`;
  }
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
      <rect width="300" height="450" fill="#1b1b1b"/>
      <circle cx="150" cy="145" r="58" fill="#3a3a3a"/>
      <rect x="72" y="225" width="156" height="110" rx="28" fill="#3a3a3a"/>
      <text x="50%" y="390" dominant-baseline="middle" text-anchor="middle" fill="#bdbdbd" font-size="20" font-family="Arial">Sem foto</text>
    </svg>
  `);
}

if(!id){
  app.innerHTML = `<div id="erro">Sem ID do filme na URL.</div>`;
} else {
  Promise.all([
    fetch("catalogo.json").then(r => r.json()),
    fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=pt-BR`).then(r => r.json()),
    fetch(`https://api.themoviedb.org/3/movie/${id}/credits?api_key=${API_KEY}&language=pt-BR`).then(r => r.json())
  ])
  .then(([lista, filme, creditos]) => {
    const local = lista.find(f => String(f.id) == String(id));

    if(!local){
      app.innerHTML = `<div id="erro">Filme não existe no catálogo.</div>`;
      return;
    }

    const backdrop = filme.backdrop_path
      ? `https://image.tmdb.org/t/p/original${filme.backdrop_path}`
      : (local.backdrop || local.capa || "");

    const poster = filme.poster_path
      ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
      : (local.capa || "");

    const titulo = filme.title || local.titulo || "Sem título";
    const ano = anoSeguro(filme.release_date || local.ano);
    const runtime = runtimeSeguro(filme.runtime || local.duracao);
    const nota = notaSeguro(filme.vote_average || local.nota);
    const votos = votosSeguro(filme.vote_count || local.votos);

    const generos = (filme.genres && filme.genres.length)
      ? filme.genres.map(g => g.name).join(", ")
      : ((local.generos || []).join(", ") || "Gênero não informado");

    const sinopse = filme.overview || local.sinopse || "Sinopse não disponível.";

    const elencoHtml = (creditos.cast || [])
      .slice(0, 12)
      .map(e => `
        <div class="ator" tabindex="0">
          <img src="${criarImagemElenco(e.profile_path, e.name)}" alt="${e.name}" loading="lazy">
          <div class="nome">${e.name}</div>
        </div>
      `)
      .join("");

    app.innerHTML = `
      <section id="hero" style="background-image:url('${backdrop}')">
        <div id="content">
          <div id="topo">
            <img id="poster" src="${poster}" alt="${titulo}">
            
            <div id="info">
              <h1 id="titulo">${titulo}</h1>

              <div id="meta">
                📅 ${ano} &nbsp; • &nbsp;
                ⏱ ${runtime} &nbsp; • &nbsp;
                ⭐ ${nota} (${votos} votos)
              </div>

              <div id="generosTexto">🎭 ${generos}</div>

              <div id="sinopse">${sinopse}</div>

              <div id="acoes">
                <a
                  href="${local.link}"
                  target="_blank"
                  tabindex="0"
                  class="botao botao-player"
                  rel="noopener noreferrer"
                >
                  ▶️ Abrir no player externo
                </a>

                <a
                  href="javascript:history.back()"
                  tabindex="0"
                  class="botao botao-voltar"
                >
                  ⬅ Voltar
                </a>
              </div>
            </div>
          </div>

          <div id="playerWrap">
            <video id="player" controls preload="metadata">
              <source src="${local.link}">
              Seu navegador não suporta vídeo HTML5.
            </video>
          </div>

          <section class="secao">
            <h2>Elenco</h2>
            <div class="elenco">
              ${elencoHtml || "<p>Nenhum elenco disponível.</p>"}
            </div>
          </section>
        </div>
      </section>
    `;

    setTimeout(() => {
      const primeiroBotao = document.querySelector(".botao");
      if(primeiroBotao && window.innerWidth >= 900){
        primeiroBotao.focus();
      }
    }, 250);
  })
  .catch(err => {
    console.error("ERRO:", err);
    app.innerHTML = `<div id="erro">Erro ao carregar dados.</div>`;
  });
}

/* ===== NAVEGAÇÃO EXTRA PARA TV ===== */
document.addEventListener("keydown", e => {
  const foco = document.activeElement;
  if(!foco) return;

  if(e.key === "Enter" && typeof foco.click === "function"){
    if(foco.tagName !== "VIDEO"){
      foco.click();
    }
  }

  if(e.key === "ArrowDown"){
    if(foco.classList.contains("botao")){
      const player = document.getElementById("player");
      if(player){
        player.focus();
        e.preventDefault();
      }
    }
  }

  if(e.key === "ArrowUp"){
    if(foco.id === "player"){
      const primeiroBotao = document.querySelector(".botao");
      if(primeiroBotao){
        primeiroBotao.focus();
        e.preventDefault();
      }
    }
  }
});
</script>
</body>
</html>
