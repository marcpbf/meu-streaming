<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmoteca</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c10;
  --surface: #13141a;
  --surface2: #1c1d26;
  --border: #252636;
  --red: #e50914;
  --red2: #b20710;
  --gold: #f5c518;
  --text: #f0f0f0;
  --muted: #8b8d9e;
  --radius: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── PLAYER OVERLAY ── */
#overlay {
  display: none; position: fixed; inset: 0; background: #000;
  z-index: 9000; flex-direction: column;
}
#overlay.on { display: flex; }
#ov-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; background: rgba(0,0,0,.92); flex-shrink: 0;
}
#ov-title {
  flex: 1; font-size: .95rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#ov-close {
  background: var(--red); border: none; color: #fff;
  font-size: 1.2rem; width: 44px; height: 44px;
  border-radius: 50%; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#ov-pasta {
  background: #1a73e8; border: none; color: #fff;
  font-size: .78rem; padding: 9px 14px; border-radius: 20px;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  display: inline-flex; align-items: center; gap: 5px;
}
#ov-frame { flex: 1; width: 100%; border: none; }
#ov-noplay {
  display: none; flex: 1; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; color: var(--muted);
}
#ov-noplay .big { font-size: 3rem; }
#ov-noplay a { color: #1a73e8; font-size: .9rem; }

/* ── HERO / HEADER ── */
#hero {
  position: relative; height: 220px; overflow: hidden;
  display: flex; align-items: flex-end;
  background: linear-gradient(135deg, #0b0c10 0%, #1a0a1e 50%, #0a0e1a 100%);
}
#hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  opacity: 0; transition: opacity 1s ease;
}
#hero-bg.loaded { opacity: .18; }
#hero-grad {
  position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg) 0%, transparent 60%);
}
#hero-content {
  position: relative; z-index: 1; padding: 0 24px 20px; width: 100%;
}
#hero-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.6rem; letter-spacing: 4px;
  color: var(--red); line-height: 1;
  text-shadow: 0 2px 20px rgba(229,9,20,.4);
}
#hero-sub { font-size: .72rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

/* ── SEARCH BAR ── */
#searchbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,12,16,.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px; display: flex; gap: 10px; align-items: center;
}
#busca-wrap {
  flex: 1; position: relative;
}
#busca-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
#busca {
  width: 100%; padding: 10px 12px 10px 38px;
  border-radius: 30px; border: 1.5px solid var(--border);
  background: var(--surface2); color: var(--text);
  font-size: .9rem; outline: none; transition: border-color .2s;
}
#busca:focus { border-color: var(--red); }
#busca::placeholder { color: var(--muted); }

#ordenar {
  background: var(--surface2); border: 1.5px solid var(--border);
  color: var(--muted); padding: 9px 10px; border-radius: 8px;
  font-size: .75rem; cursor: pointer; outline: none; flex-shrink: 0;
}
#ordenar option { background: var(--surface); }

/* ── FILTROS ── */
#filtros-wrap {
  padding: 10px 20px; overflow-x: auto; display: flex; gap: 8px;
  scrollbar-width: none; background: var(--bg);
}
#filtros-wrap::-webkit-scrollbar { display: none; }
.chip {
  background: var(--surface2); border: 1.5px solid var(--border);
  color: var(--muted); padding: 5px 14px; border-radius: 20px;
  cursor: pointer; white-space: nowrap; font-size: .78rem;
  transition: all .15s; flex-shrink: 0; user-select: none;
}
.chip.on { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }

/* ── INFO BAR ── */
#infobar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 20px 10px; font-size: .75rem; color: var(--muted);
}
#infobar strong { color: var(--text); }

/* ── GRADE ── */
#grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px; padding: 0 20px 60px;
}

.card {
  border-radius: var(--radius); overflow: hidden; cursor: pointer;
  border: 2px solid transparent; transition: border-color .15s, transform .15s, box-shadow .15s;
  background: var(--surface); position: relative;
}
.card:hover, .card:focus {
  border-color: var(--red);
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(229,9,20,.25);
  outline: none; z-index: 2;
}
.card.no-video { opacity: .6; }

.card-poster {
  width: 100%; aspect-ratio: 2/3;
  background: var(--surface2);
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.card-poster img {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0;
  opacity: 0; transition: opacity .4s ease;
}
.card-poster img.loaded { opacity: 1; }
.card-poster-placeholder {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 8px; color: var(--muted);
  font-size: .65rem; text-align: center; padding: 10px;
  position: relative; z-index: 1;
}
.card-poster-placeholder .emoji { font-size: 2.2rem; }

.card-badge-ano {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,.8); color: var(--gold);
  font-size: .62rem; padding: 2px 6px; border-radius: 10px;
  font-weight: 700; z-index: 2;
}
.card-badge-noplay {
  position: absolute; bottom: 5px; left: 5px;
  background: rgba(0,0,0,.75); color: #888;
  font-size: .58rem; padding: 2px 6px; border-radius: 6px; z-index: 2;
}
.card-play-btn {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s; z-index: 3;
  background: rgba(0,0,0,.45);
}
.card:hover .card-play-btn, .card:focus .card-play-btn { opacity: 1; }
.card-play-btn svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,.8)); }

.card-info {
  padding: 8px 8px 10px;
}
.card-titulo {
  font-size: .74rem; font-weight: 600; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
  color: var(--text);
}

/* ── SEM RESULTADO ── */
#empty {
  display: none; text-align: center;
  padding: 80px 20px; color: var(--muted);
}
#empty .big { font-size: 3rem; margin-bottom: 12px; }

/* TV D-PAD */
@media (hover: none) {
  .card:hover { transform: none; border-color: transparent; box-shadow: none; }
  .card:focus { transform: scale(1.06); border-color: var(--red); box-shadow: 0 8px 30px rgba(229,9,20,.25); }
}
</style>
</head>

const TMDB_KEY = '9a9a8c6e53bf1e6c407b689e729a43c9';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w300';
const TMDB_SEARCH = 'https://api.themoviedb.org/3/search/movie';

// cache de posters em memória
const posterCache = {};
let heroTimer = null;
let heroFilmes = [];

// ── GÊNERO ──────────────────────────────────────────────────────────────────
function getGenero(t) {
  t = t.toLowerCase();
  if (/vingadores|homem.aranha|batman|capitão|thor|hulk|superman|deadpool|pantera|doutor|eternos|shang|capitã|iron man|visão|gavião|wanda|loki|ant.man|kraven|spider/.test(t)) return 'heroi';
  if (/terror|pânico|medo|horror|bruxa|sombra|ritual|marrowbone|assombra|maldição|fantasma|paranormal|demônio|exorcist|insidious|conjuring|annabelle|chorona/.test(t)) return 'terror';
  if (/guerra|batalha|combate|soldado|militar|predador|rambo|sniper|pelotão|frente|operação|invasão|resgate|fronteira|tropa|comando/.test(t)) return 'acao';
  if (/nemo|dory|rango|leão|floresta|macacos|patrulha|domésticos|ratatouille|coco|moana|toy story|buzz|gato|cachorro|panda|shrek|minion|lego|encanto|pássaro/.test(t)) return 'animacao';
  if (/parasita|silêncio|psicopata|assassin|crime|roubo|sequestro|serial|hannibal|golpe|ladrão|fraude|tráfico|cartel|narco|contador|pig/.test(t)) return 'suspense';
  if (/bourne|caçador|perseguição|agentes|imparável|vingança|john wick|espião|agente|007|missão|beekeeper|largo winch/.test(t)) return 'espionagem';
  if (/prometheus|planeta|alien|marte|space|galáxia|interestelar|star|robô|matrix|avatar|tron|poder paranormal|projeto almanaque/.test(t)) return 'ficcao';
  if (/amor|romance|casamento|coração|paixão|sedução|quando|por toda|palmer|cinquenta|queria você|separados|toda minha vida/.test(t)) return 'romance';
  if (/jesus|cristo|bíblia|deus|fé|oração|milagre|apóstolo|evangelho|cristão|quarto de guerra|paulo/.test(t)) return 'religioso';
  if (/zodíaco|cavaleiros|saint seiya|anime/.test(t)) return 'anime';
  if (/simpsons|comédia|engraçad|pronto falei|podres de ricos/.test(t)) return 'comedia';
  return 'outros';
}

const GENERO_EMOJI = {
  heroi:'🦸', terror:'👻', acao:'⚔️', animacao:'🐾',
  suspense:'🔪', espionagem:'🎯', ficcao:'🚀', romance:'❤️',
  religioso:'✝️', anime:'⚡', comedia:'😂', outros:'🎬'
};

// adicionar genero a cada filme
FILMES.forEach(f => { f.genero = getGenero(f.titulo); });

// ── TMDB POSTER ──────────────────────────────────────────────────────────────
async function fetchPoster(titulo, ano) {
  const key = titulo + '_' + ano;
  if (posterCache[key] !== undefined) return posterCache[key];
  try {
    const q = encodeURIComponent(titulo);
    const yr = ano ? `&year=${ano}` : '';
    const url = `${TMDB_SEARCH}?api_key=${TMDB_KEY}&query=${q}${yr}&language=pt-BR&include_adult=false`;
    const r = await fetch(url);
    if (!r.ok) { posterCache[key] = null; return null; }
    const d = await r.json();
    const path = d.results?.[0]?.poster_path || null;
    posterCache[key] = path ? TMDB_IMG + path : null;
  } catch(e) { posterCache[key] = null; }
  return posterCache[key];
}

// ── RENDER ───────────────────────────────────────────────────────────────────
let generoFiltro = '';
const grade = document.getElementById('grade');

function setChip(el, g) {
  generoFiltro = g;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  filtrar();
}

function filtrar() {
  const q = document.getElementById('busca').value.toLowerCase().trim();
  const ordem = document.getElementById('ordenar').value;
  let lista = FILMES.filter(f => {
    const mq = !q || f.titulo.toLowerCase().includes(q) || f.ano.includes(q);
    const mg = !generoFiltro || f.genero === generoFiltro;
    return mq && mg;
  });
  if (ordem === 'az') lista.sort((a,b) => a.titulo.localeCompare(b.titulo, 'pt'));
  else if (ordem === 'za') lista.sort((a,b) => b.titulo.localeCompare(a.titulo, 'pt'));
  else if (ordem === 'novo') lista.sort((a,b) => (b.ano||0)-(a.ano||0));
  else if (ordem === 'antigo') lista.sort((a,b) => (a.ano||9999)-(b.ano||9999));
  renderizar(lista);
}

function renderizar(lista) {
  grade.innerHTML = '';
  document.getElementById('empty').style.display = lista.length ? 'none' : 'block';
  const total = lista.length;
  document.getElementById('contador').innerHTML = `<strong>${total}</strong> filme${total !== 1 ? 's' : ''}`;
  document.getElementById('hero-sub').textContent = FILMES.length + ' filmes no catálogo';

  lista.forEach(f => {
    const em = GENERO_EMOJI[f.genero] || '🎬';
    const hasPlay = !!f.player;
    const card = document.createElement('div');
    card.className = 'card' + (hasPlay ? '' : ' no-video');
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="card-poster">
        <div class="card-poster-placeholder">
          <div class="emoji">${em}</div>
          <div>${f.titulo}</div>
        </div>
        <img data-titulo="${f.titulo}" data-ano="${f.ano}" alt="${f.titulo}" loading="lazy">
        <span class="card-badge-ano">${f.ano}</span>
        ${!hasPlay ? '<span class="card-badge-noplay">📂 pasta</span>' : ''}
        ${hasPlay ? `<div class="card-play-btn"><svg width="38" height="38" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.5)" stroke="white" stroke-width="1.2"/><polygon points="10,8 17,12 10,16" fill="white"/></svg></div>` : ''}
      </div>
      <div class="card-info"><div class="card-titulo">${f.titulo}</div></div>`;
    card.onclick = () => openPlayer(f);
    card.onkeydown = e => { if (e.key==='Enter'||e.key===' ') openPlayer(f); };
    grade.appendChild(card);
  });

  // lazy load posters via IntersectionObserver
  loadVisiblePosters();
  heroFilmes = lista.filter(f => f.player);
  rotateHero();
}

// ── LAZY POSTER LOADER ───────────────────────────────────────────────────────
const imgObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const img = e.target;
      loadImg(img);
      imgObserver.unobserve(img);
    }
  });
}, { rootMargin: '200px' });

function loadVisiblePosters() {
  document.querySelectorAll('.card-poster img[data-titulo]').forEach(img => {
    imgObserver.observe(img);
  });
}

async function loadImg(img) {
  const titulo = img.dataset.titulo;
  const ano = img.dataset.ano;
  const url = await fetchPoster(titulo, ano);
  if (url) {
    img.src = url;
    img.onload = () => img.classList.add('loaded');
  }
}

// ── HERO ROTATIVO ─────────────────────────────────────────────────────────────
let heroIdx = 0;
function rotateHero() {
  if (!heroFilmes.length) return;
  clearTimeout(heroTimer);
  const f = heroFilmes[heroIdx % heroFilmes.length];
  heroIdx++;
  fetchPoster(f.titulo, f.ano).then(url => {
    if (url) {
      const bg = document.getElementById('hero-bg');
      bg.style.backgroundImage = `url(${url})`;
      setTimeout(() => bg.classList.add('loaded'), 50);
    }
  });
  heroTimer = setTimeout(rotateHero, 6000);
}

// ── PLAYER ───────────────────────────────────────────────────────────────────
let filmeAtual = null;
function openPlayer(f) {
  filmeAtual = f;
  document.getElementById('ov-title').textContent = f.titulo + ' (' + f.ano + ')';
  document.getElementById('ov-pasta').href = f.url_pasta;
  document.getElementById('ov-pasta2').href = f.url_pasta;
  const frame = document.getElementById('ov-frame');
  const noplay = document.getElementById('ov-noplay');
  if (f.player) {
    frame.src = f.player;
    frame.style.display = 'block';
    noplay.style.display = 'none';
  } else {
    frame.src = '';
    frame.style.display = 'none';
    noplay.style.display = 'flex';
  }
  document.getElementById('overlay').classList.add('on');
}

function closePlayer() {
  document.getElementById('ov-frame').src = '';
  document.getElementById('overlay').classList.remove('on');
}

document.addEventListener('keydown', e => {
  if ((e.key==='Escape'||e.key==='Backspace') && document.getElementById('overlay').classList.contains('on')) closePlayer();
});

// ── INIT ─────────────────────────────────────────────────────────────────────
filtrar();
</script>
