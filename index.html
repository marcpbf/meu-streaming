<head>
<meta charset="UTF-8">

<title>🎬 Meus Filmes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
  }

  /* PLAYER */
  #player-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    flex-direction: column;
  }
  #player-overlay.ativo { display: flex; }

  #player-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: rgba(0,0,0,0.8);
  }
  #player-title { font-size: 1.1rem; font-weight: 600; flex: 1; }
  #btn-fechar {
    background: #e53935;
    border: none;
    color: #fff;
    font-size: 1.4rem;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
  }

  #player-frame {
    flex: 1;
    width: 100%;
    border: none;
  }

  /* CABEÇALHO */
  header {
    padding: 24px 20px 12px;
    background: linear-gradient(180deg, #111 0%, transparent 100%);
  }
  header h1 { font-size: 1.6rem; letter-spacing: 1px; }
  header span { color: #e53935; }

  /* BUSCA */
  #busca-wrap {
    padding: 12px 20px;
    position: sticky;
    top: 0;
    background: #0a0a0f;
    z-index: 10;
  }
  #busca {
    width: 100%;
    padding: 12px 16px;
    border-radius: 30px;
    border: 2px solid #333;
    background: #1a1a2e;
    color: #eee;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  #busca:focus { border-color: #e53935; }

  /* CONTADOR */
  #contador {
    padding: 4px 20px 10px;
    font-size: 0.82rem;
    color: #777;
  }

  /* GRADE */
  #grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    padding: 0 20px 40px;
  }

  .card {
    background: #16213e;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .15s, transform .15s;
    /* navegação por controle remoto */
  }
  .card:focus, .card:hover {
    border-color: #e53935;
    transform: scale(1.04);
    outline: none;
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 2/3;
    background: #0f3460;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }

  .card-info {
    padding: 10px;
  }
  .card-titulo {
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-ano {
    font-size: 0.72rem;
    color: #e53935;
    margin-top: 4px;
  }

  /* TV: remover hover e usar focus */
  @media (hover: none) {
    .card:hover { transform: none; border-color: transparent; }
    .card:focus { transform: scale(1.06); border-color: #e53935; }
  }
</style>
</head>
<body>

<!-- PLAYER -->
<div id="player-overlay">

// ── EMOJIS POR GÊNERO APROXIMADO ──────────────────────────────────────────────
function emoji(titulo) {
  const t = titulo.toLowerCase();
  if (/vingadores|homem|spider|batman|capitão|thor|hulk|superman|herói|super/.test(t)) return '🦸';
  if (/terror|pânico|medo|horror|bruxa|sombra|ritual|marrowbone/.test(t)) return '👻';
  if (/guerra|batalha|combate|soldado|militar|predador|rambo/.test(t)) return '⚔️';
  if (/nemo|dory|rango|leão|floresta|macacos|patrulha|domésticos/.test(t)) return '🐾';
  if (/parasita|silêncio|psicopata|assassin|crime|roubo|sequestro/.test(t)) return '🔪';
  if (/bourne|caçador|perseguição|agentes|imparável|vingança/.test(t)) return '🎯';
  if (/ficção|prometheus|planeta|alien|sci/.test(t)) return '🚀';
  if (/pulp|priscilla|simpsons|racionais/.test(t)) return '🎭';
  if (/amor|vida|liberdade|palmer|por toda/.test(t)) return '❤️';
  return '🎬';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const grade = document.getElementById('grade');
const contador = document.getElementById('contador');

function renderizar(lista) {
  grade.innerHTML = '';
  contador.textContent = `${lista.length} filme${lista.length !== 1 ? 's' : ''}`;
  lista.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="card-thumb">${emoji(f.titulo)}</div>
      <div class="card-info">
        <div class="card-titulo">${f.titulo}</div>
        <div class="card-ano">${f.ano}</div>
      </div>`;
    card.onclick = () => abrirPlayer(f);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') abrirPlayer(f); };
    grade.appendChild(card);
  });
}

function filtrar() {
  const q = document.getElementById('busca').value.toLowerCase().trim();
  const resultado = q ? filmes.filter(f => f.titulo.toLowerCase().includes(q) || f.ano.includes(q)) : filmes;
  renderizar(resultado);
}

// ── PLAYER ────────────────────────────────────────────────────────────────────
function abrirPlayer(f) {
  document.getElementById('player-title').textContent = `${f.titulo} (${f.ano})`;
  document.getElementById('player-frame').src = f.player;
  document.getElementById('player-overlay').classList.add('ativo');
}

function fecharPlayer() {
  document.getElementById('player-frame').src = '';
  document.getElementById('player-overlay').classList.remove('ativo');
}

// fechar com ESC (TVs com controle)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharPlayer();
  if (e.key === 'Backspace' && document.getElementById('player-overlay').classList.contains('ativo')) fecharPlayer();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderizar(filmes);
</script>
