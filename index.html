<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🎬 Filmoteca</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080d;--s:#0f1018;--s2:#181924;--border:#1e1f33;
  --amber:#f5a623;--green:#22c55e;--red:#ef4444;
  --text:#eef0f8;--muted:#5a5c78;--radius:10px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(7,8,13,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:16px 40px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:3px;color:var(--amber);white-space:nowrap}
.logo span{color:var(--text);opacity:.4;font-size:.9rem;letter-spacing:1px;margin-left:8px;font-family:'Inter',sans-serif;font-weight:300}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;
}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:.82rem;width:180px}
.search-box input::placeholder{color:var(--muted)}
.badge-count{
  background:var(--s2);border-radius:20px;padding:4px 12px;
  font-size:.72rem;color:var(--amber);border:1px solid rgba(245,166,35,.25);white-space:nowrap;
}

/* TMDB BAR */
.tmdb-bar{
  background:linear-gradient(90deg,#0d0d1f,#111128);
  border-bottom:1px solid #1a1a35;
  padding:10px 40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tmdb-bar label{font-size:.7rem;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.tmdb-bar input{
  background:var(--s2);border:1px solid var(--border);border-radius:6px;
  padding:6px 12px;color:var(--text);font-size:.78rem;width:240px;outline:none;
}
.tmdb-bar input:focus{border-color:var(--amber)}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:6px;border:none;
  font-size:.78rem;font-weight:700;cursor:pointer;letter-spacing:.3px;
  transition:opacity .15s,transform .1s;
}
.btn:hover:not(:disabled){opacity:.85;transform:scale(1.02)}
.btn:disabled{opacity:.3;cursor:default}
.btn-amber{background:var(--amber);color:#000}
.btn-ghost{background:var(--s2);color:var(--text);border:1px solid var(--border)}
.progress-wrap{flex:1;min-width:100px;height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),#fbbf24);width:0%;transition:width .3s;border-radius:2px}
.tmdb-status{font-size:.7rem;color:var(--muted);white-space:nowrap}

/* FILTERS */
.filters{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:14px 40px 4px;
}
.fbtn{
  background:var(--s);border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;font-size:.7rem;color:var(--muted);cursor:pointer;
  transition:all .12s;letter-spacing:.3px;
}
.fbtn:hover,.fbtn.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}

/* GRID */
main{padding:18px 40px 60px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

/* CARD */
.card{
  border-radius:var(--radius);overflow:hidden;cursor:pointer;
  outline:none;border:2px solid transparent;background:var(--s);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.card:hover,.card:focus{
  border-color:var(--amber);
  box-shadow:0 0 0 2px rgba(245,166,35,.4),0 8px 30px rgba(245,166,35,.2);
  transform:scale(1.05);z-index:5;position:relative;
}
.poster{width:100%;aspect-ratio:2/3;background:var(--s2);position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.poster img.loaded{opacity:1}
.poster-placeholder{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;
  background:linear-gradient(160deg,var(--s2),var(--bg));
}
.poster-placeholder-icon{font-size:2.2rem;opacity:.2}
.poster-placeholder-title{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:1px;opacity:.55;line-height:1.2}
.qual-badge{
  position:absolute;top:6px;right:6px;
  background:rgba(0,0,0,.7);border:1px solid rgba(245,166,35,.35);
  color:var(--amber);font-size:.55rem;font-weight:700;
  padding:2px 5px;border-radius:4px;letter-spacing:.8px;
}
.nota-badge{
  position:absolute;bottom:6px;left:6px;
  background:rgba(0,0,0,.75);border-radius:4px;
  padding:2px 6px;font-size:.6rem;color:#fbbf24;font-weight:700;
}
.card-footer{
  padding:8px 10px 10px;
  display:flex;align-items:center;gap:6px;
}
.card-title{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.play-btn{
  width:22px;height:22px;border-radius:50%;
  background:var(--amber);color:#000;
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;flex-shrink:0;
  transition:background .12s;
}
.card:hover .play-btn,.card:focus .play-btn{background:#fff}

/* PLAYER */
.player-ov{display:none;position:fixed;inset:0;background:#000;z-index:200;flex-direction:column}
.player-ov.on{display:flex}
.player-bar{
  display:flex;align-items:center;gap:12px;
  padding:10px 18px;background:#000;border-bottom:1px solid #111;flex-shrink:0;
}
.player-thumb{width:32px;height:48px;border-radius:4px;object-fit:cover;flex-shrink:0}
.player-thumb-ph{width:32px;height:48px;border-radius:4px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.player-info{flex:1;min-width:0}
.player-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{font-size:.65rem;color:var(--muted);margin-top:1px}
.player-close{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 14px;font-size:.78rem;cursor:pointer}
.player-close:hover{background:#222}
.iframe-wrap{flex:1;display:flex}
.iframe-wrap iframe{width:100%;height:100%;border:none}
.fallback{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;flex:1;text-align:center;padding:40px;
}
.fallback.on{display:flex}
.fallback h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px}
.fallback p{color:var(--muted);max-width:360px;line-height:1.6;font-size:.82rem}
.btn-drive{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 24px;background:var(--amber);color:#000;
  border-radius:8px;font-size:.9rem;font-weight:700;text-decoration:none;
}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 20px;text-align:center;color:var(--muted)}
.empty-icon{font-size:3rem;opacity:.2}
.empty h3{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px}

@media(min-width:1400px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
}
@media(min-width:1920px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px}
  header,.tmdb-bar,.filters,main{padding-left:60px;padding-right:60px}
}
</style>
</head>

<header>
  <div class="logo">🎬 Filmoteca <span>Drive · 920 filmes</span></div>
  <div class="header-right">
    <div class="search-box">

    <button class="player-close" id="pClose">✕ Fechar</button>

</div>

async function loadAll(){
  const key=document.getElementById("tmdbKey").value.trim();
  if(!key){alert("Informe a chave TMDB!");return}
  document.getElementById("btnLoad").disabled=true;
  const total=filmes.length;
  const pBar=document.getElementById("pBar");
  const pStatus=document.getElementById("pStatus");
  
  // Pega mapa de gêneros
  try{
    const gr=await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${key}&language=pt-BR`);
    const gd=await gr.json();
    window._gmap={};
    (gd.genres||[]).forEach(g=>window._gmap[g.id]=g.name);
  }catch(e){}

  for(let i=0;i<total;i++){
    const f=filmes[i];
    pStatus.textContent=`${i+1}/${total} — ${f.titulo.substring(0,30)}`;
    pBar.style.width=((i/total)*100)+"%";
    
    try{
      const url=`https://api.themoviedb.org/3/search/movie?api_key=${key}&query=${encodeURIComponent(f.titulo)}&language=pt-BR${f.ano?"&year="+f.ano:""}`;
      const r=await fetch(url);
      const d=await r.json();
      if(d.results&&d.results.length>0){
        const m=d.results[0];
        filmes[i].capa=m.poster_path?`https://image.tmdb.org/t/p/w342${m.poster_path}`:null;
        filmes[i].sinopse=m.overview||null;
        filmes[i].nota=m.vote_average?+m.vote_average.toFixed(1):null;
        filmes[i].tmdb_id=m.id;
        if(m.genre_ids&&window._gmap){
          filmes[i].generos=m.genre_ids.map(id=>window._gmap[id]).filter(Boolean);
          filmes[i].generos.forEach(g=>genreSet.add(g));
        }
        // Atualiza card inline
        updateCard(i);
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,220));
  }
  
  pBar.style.width="100%";
  pStatus.textContent=`✅ ${total} filmes carregados!`;
  document.getElementById("btnLoad").disabled=false;
  tmdbLoaded=true;
  buildGenreFilters();
  applyFilters();
}

function updateCard(i){
  const el=document.getElementById("card_"+i);
  if(!el)return;
  const f=filmes[i];
  const posterEl=el.querySelector(".poster");
  if(f.capa){
    posterEl.innerHTML=`<img src="${f.capa}" alt="" loading="lazy" onload="this.classList.add('loaded')"/>
    <div class="qual-badge">${f.qual}</div>
    ${f.nota?`<div class="nota-badge">⭐ ${f.nota}</div>`:""}`;
  }
}

// ─── RENDER ───
function renderGrid(lista){
  const grid=document.getElementById("grid");
  document.getElementById("badgeCount").textContent=lista.length+" filmes";
  grid.innerHTML="";
  
  if(!lista.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🎬</div><h3>Nenhum resultado</h3></div>`;
    return;
  }
  
  const frag=document.createDocumentFragment();
  lista.forEach(f=>{
    const i=filmes.indexOf(f);
    const card=document.createElement("div");
    card.className="card";
    card.tabIndex=0;
    card.id="card_"+i;
    card.setAttribute("aria-label","Assistir "+f.titulo);
    
    const posterHTML=f.capa
      ?`<img src="${f.capa}" alt="" loading="lazy" onload="this.classList.add('loaded')"/>
         <div class="qual-badge">${f.qual}</div>
         ${f.nota?`<div class="nota-badge">⭐ ${f.nota}</div>`:""}`
      :`<div class="poster-placeholder">
          <div class="poster-placeholder-icon">🎬</div>
          <div class="poster-placeholder-title">${f.titulo}</div>
        </div>
        <div class="qual-badge">${f.qual}</div>`;
    
    card.innerHTML=`
      <div class="poster">${posterHTML}</div>
      <div class="card-footer">
        <span class="card-title">${f.titulo}</span>
        <div class="play-btn">▶</div>
      </div>`;
    
    card.onclick=()=>openPlayer(f);
    card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPlayer(f)}};
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

// ─── FILTERS ───
function buildGenreFilters(){
  const bar=document.getElementById("filtersBar");
  bar.innerHTML=`<button class="fbtn ${genreActive==="all"?"on":""}" onclick="setGenre('all',this)">Todos</button>`;
  [...genreSet].sort().forEach(g=>{
    const b=document.createElement("button");
    b.className="fbtn"+(genreActive===g?" on":"");
    b.textContent=g;
    b.onclick=function(){setGenre(g,this)};
    bar.appendChild(b);
  });
}

function setGenre(g,el){
  genreActive=g;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  applyFilters();
}

function applyFilters(){
  const q=document.getElementById("srch").value.toLowerCase();
  const filtered=filmes.filter(f=>{
    const matchG=genreActive==="all"||f.generos.includes(genreActive);
    const matchS=!q||f.titulo.toLowerCase().includes(q)||f.nome.toLowerCase().includes(q);
    return matchG&&matchS;
  });
  renderGrid(filtered);
}

// ─── PLAYER ───
let lastFocus=null;
function openPlayer(f){
  lastFocus=document.activeElement;
  document.getElementById("pTitle").textContent=f.titulo;
  document.getElementById("pMeta").textContent=[f.ano,f.qual,f.nota?"⭐ "+f.nota:null].filter(Boolean).join(" · ");
  const tw=document.getElementById("thumbWrap");
  tw.innerHTML=f.capa
    ?`<img src="${f.capa}" class="player-thumb" alt=""/>`
    :`<div class="player-thumb-ph">🎬</div>`;
  document.getElementById("pFrame").src=`https://drive.google.com/file/d/${f.id}/preview`;
  document.getElementById("fallbackLink").href=`https://drive.google.com/file/d/${f.id}/view`;
  document.getElementById("pFrame").style.display="block";
  document.getElementById("fallback").classList.remove("on");
  document.getElementById("playerOv").classList.add("on");
  setTimeout(()=>document.getElementById("pClose").focus(),100);
}
function closePlayer(){
  document.getElementById("playerOv").classList.remove("on");
  document.getElementById("pFrame").src="";
  if(lastFocus)lastFocus.focus();
}
document.getElementById("pClose").onclick=closePlayer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePlayer()});

// ─── INIT ───
renderGrid(filmes);
</script>
</body>
</html>
