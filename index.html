<title>🎬 Meus Filmes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#eee;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}

  /* PLAYER */
  #player-overlay{display:none;position:fixed;inset:0;background:#000;z-index:1000;flex-direction:column}
  #player-overlay.ativo{display:flex}
  #player-header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:rgba(0,0,0,.85)}
  #player-title{font-size:1rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btn-fechar{background:#e53935;border:none;color:#fff;font-size:1.4rem;width:48px;height:48px;border-radius:50%;cursor:pointer;flex-shrink:0}
  #player-frame{flex:1;width:100%;border:none}

  /* HEADER */
  header{padding:20px 20px 8px;background:linear-gradient(180deg,#111 0%,transparent 100%)}
  header h1{font-size:1.5rem;letter-spacing:1px}
  header span{color:#e53935}
  .subtitulo{font-size:.8rem;color:#666;margin-top:3px}

  /* BUSCA + FILTROS */
  #controles{padding:10px 20px;position:sticky;top:0;background:#0a0a0f;z-index:10}
  #busca{width:100%;padding:11px 16px;border-radius:30px;border:2px solid #333;background:#1a1a2e;color:#eee;font-size:1rem;outline:none;transition:border-color .2s}
  #busca:focus{border-color:#e53935}
  #filtros{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  #filtros::-webkit-scrollbar{display:none}
  .chip{background:#1a1a2e;border:1.5px solid #333;color:#aaa;padding:5px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:.8rem;transition:all .15s}
  .chip.ativo{background:#e53935;border-color:#e53935;color:#fff}

  /* CONTADOR + ORDENAR */
  #barra-info{display:flex;justify-content:space-between;align-items:center;padding:4px 20px 8px;font-size:.8rem;color:#666}
  #ordenar{background:transparent;border:1px solid #333;color:#aaa;padding:3px 8px;border-radius:8px;font-size:.75rem;cursor:pointer}
  #ordenar option{background:#1a1a2e}

  /* GRADE */
  #grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:0 20px 40px}
  .card{background:#16213e;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s}
  .card:focus,.card:hover{border-color:#e53935;transform:scale(1.04);outline:none}
  .card-thumb{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#0f3460,#16213e);display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative}
  .card-ano-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#e53935;font-size:.65rem;padding:2px 6px;border-radius:10px;font-weight:700}
  .card-info{padding:8px}
  .card-titulo{font-size:.78rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* SEM RESULTADO */
  #sem-resultado{display:none;text-align:center;padding:60px 20px;color:#555}
  #sem-resultado .icon{font-size:3rem;margin-bottom:12px}

  @media(hover:none){.card:hover{transform:none;border-color:transparent}.card:focus{transform:scale(1.06);border-color:#e53935}}
</style>
</head>

document.getElementById('subtitulo').textContent = filmes.length + ' filmes disponíveis';

let generoAtivo = '';

function setGenero(g) {
  generoAtivo = g;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
  event.target.classList.add('ativo');
  filtrar();
}

function filtrar() {
  const q = document.getElementById('busca').value.toLowerCase().trim();
  const ordem = document.getElementById('ordenar').value;

  let lista = filmes.filter(f => {
    const matchQ = !q || f.titulo.toLowerCase().includes(q) || f.ano.includes(q);
    const matchG = !generoAtivo || f.emoji === generoAtivo;
    return matchQ && matchG;
  });

  if (ordem === 'az') lista.sort((a,b) => a.titulo.localeCompare(b.titulo, 'pt'));
  else if (ordem === 'za') lista.sort((a,b) => b.titulo.localeCompare(a.titulo, 'pt'));
  else if (ordem === 'novo') lista.sort((a,b) => (b.ano||0) - (a.ano||0));
  else if (ordem === 'antigo') lista.sort((a,b) => (a.ano||9999) - (b.ano||9999));

  renderizar(lista);
}

const grade = document.getElementById('grade');
const contador = document.getElementById('contador');
const semResultado = document.getElementById('sem-resultado');

function renderizar(lista) {
  grade.innerHTML = '';
  contador.textContent = lista.length + ' filme' + (lista.length !== 1 ? 's' : '');
  semResultado.style.display = lista.length ? 'none' : 'block';

  lista.forEach(f => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="card-thumb">
        ${f.emoji}
        <span class="card-ano-badge">${f.ano}</span>
      </div>
      <div class="card-info">
        <div class="card-titulo">${f.titulo}</div>
      </div>`;
    card.onclick = () => abrirPlayer(f);
    card.onkeydown = e => { if (e.key==='Enter'||e.key===' ') abrirPlayer(f); };
    grade.appendChild(card);
  });
}

function abrirPlayer(f) {
  document.getElementById('player-title').textContent = f.titulo + ' (' + f.ano + ')';
  document.getElementById('player-frame').src = f.player;
  document.getElementById('player-overlay').classList.add('ativo');
}

function fecharPlayer() {
  document.getElementById('player-frame').src = '';
  document.getElementById('player-overlay').classList.remove('ativo');
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape'||e.key==='Backspace') {
    if (document.getElementById('player-overlay').classList.contains('ativo')) fecharPlayer();
  }
});

filtrar();
</script>
